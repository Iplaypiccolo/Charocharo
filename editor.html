<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>차로차로 모션 에디터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 왼쪽 파츠 · 가운데 무대 · 오른쪽 속성/규칙 · 아래 타임라인 (좁은 화면에서는 세로로 쌓임) */
:root {
  --bg: #EEF1F4;
  --panel: #FFFFFF;
  --panel-2: #F6F8FA;
  --ink: #17212B;
  --muted: #5A6774;
  --line: #D6DDE4;
  --line-strong: #B9C3CD;
  --accent: #DE6A0C;
  --accent-ink: #FFFFFF;
  --accent-soft: #FCE9D9;
  --accent-text: #A84D05;
  --danger: #C2362F;
  --chk1: #FFFFFF;
  --chk2: #E6EBF0;
  --f-ui: "IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-display: "Do Hyeon", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  --lab: 148px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151B; --panel: #161E26; --panel-2: #1B242D; --ink: #E4EAF0; --muted: #94A2AF;
    --line: #27323D; --line-strong: #3A4754; --accent: #F2883A; --accent-ink: #1A0E04;
    --accent-soft: #3A2414; --accent-text: #F6A867; --danger: #F07068; --chk1: #1A222A; --chk2: #212B35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151B; --panel: #161E26; --panel-2: #1B242D; --ink: #E4EAF0; --muted: #94A2AF;
  --line: #27323D; --line-strong: #3A4754; --accent: #F2883A; --accent-ink: #1A0E04;
  --accent-soft: #3A2414; --accent-text: #F6A867; --danger: #F07068; --chk1: #1A222A; --chk2: #212B35;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-ui); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.app {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr) 348px;
  grid-template-rows: auto minmax(0, 1fr) 272px;
  grid-template-areas: "bar bar bar" "parts stage side" "tl tl tl";
  height: 100%;
  gap: 1px;
  background: var(--line);
}
.chars { display: flex; gap: 4px; flex-wrap: wrap; }
.chars a { font: 600 13px var(--sans, inherit); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: inherit; text-decoration: none; background: transparent; }
.chars a[aria-current="page"] { background: var(--ink, #10243a); color: var(--bg, #fff); border-color: transparent; }
.chars a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
.bar { grid-area: bar; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.stripe { width: 26px; height: 26px; border-radius: 6px; flex: none;
  background: repeating-linear-gradient(135deg, var(--accent) 0 6px, var(--ink) 6px 12px); }
.brand h1 { margin: 0; font: 400 22px/1 var(--f-display); letter-spacing: 0.01em; }
.brand small { color: var(--muted); font-size: 12px; }
.bar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.save-state { color: var(--muted); font-size: 12px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--panel);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; line-height: 1.4; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
.icon { width: 16px; height: 16px; flex: none; }
.ibtn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 6px; border: 1px solid transparent;
  background: transparent; cursor: pointer; color: var(--muted); padding: 0; }
.ibtn:hover { background: var(--panel-2); color: var(--ink); }
.ibtn.armed { background: var(--danger); color: #fff; }
.ibtn:disabled { opacity: 0.3; cursor: default; }

.panel { background: var(--panel); min-width: 0; min-height: 0; overflow: auto; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 6px; }
.panel-h h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; margin: 0; line-height: 1.55; text-wrap: pretty; }

/* 파츠 목록 */
.parts { grid-area: parts; }
.parts .hint { padding: 0 14px 10px; }
#partList { list-style: none; margin: 0; padding: 0 6px 12px; display: grid; gap: 2px; }
.part { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 5px 6px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.part:hover { background: var(--panel-2); }
.part.sel { background: var(--accent-soft); border-color: var(--accent); }
.part.off .pname, .part.off .thumb { opacity: 0.4; }
.thumb { width: 30px; height: 30px; border-radius: 6px; object-fit: contain; border: 1px solid var(--line);
  background: conic-gradient(var(--chk2) 25%, var(--chk1) 0 50%, var(--chk2) 0 75%, var(--chk1) 0) 0 0 / 10px 10px; }
.pname { min-width: 0; }
.pname b { display: block; font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pname span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbtns { display: flex; gap: 0; }
.pbtns .ibtn { width: 24px; height: 26px; }
.pbtns .ibtn .icon { width: 15px; height: 15px; }

/* 무대 */
.stage-col { grid-area: stage; background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 16px; gap: 10px; overflow: auto; }
.stage-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; padding: 2px; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.chip.live { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
.stage-wrap { flex: 1 1 0; min-height: 220px; display: grid; place-items: center; overflow: hidden; }
#stage { width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line);
  background: conic-gradient(var(--chk2) 25%, var(--chk1) 0 50%, var(--chk2) 0 75%, var(--chk1) 0) 0 0 / 24px 24px;
  touch-action: none; cursor: default; display: block; }
#stage.grab { cursor: grab; }
.testbar { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.testbar .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.testbar label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }

/* 오른쪽 */
.side { grid-area: side; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 2px; padding: 10px 10px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { border: 0; background: transparent; padding: 7px 10px 9px; cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.tab-body { padding: 4px 14px 18px; display: grid; gap: 4px; align-content: start; }
.sec { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.sec:last-child { border-bottom: 0; }
.sec h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
.name-input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: var(--panel-2); font-weight: 500; }
.ctx-note { font-size: 12px; color: var(--muted); }
.ctx-note b { color: var(--accent-text); font-weight: 500; }
.prow { display: grid; grid-template-columns: 70px minmax(0, 1fr) 70px 22px 26px; align-items: center; gap: 6px; }
.prow label { font-size: 12.5px; color: var(--muted); }
.prow input[type=range] { width: 100%; accent-color: var(--accent); min-width: 0; }
.prow input[type=number], .field input[type=number], .field input[type=text], .field select, .prow select, .rule select, .rule input {
  width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--panel-2); min-width: 0; }
.prow input[type=number] { font-family: var(--f-num); font-size: 12.5px; text-align: right; }
.unit { font-size: 11px; color: var(--muted); }
.prow.img { grid-template-columns: 70px minmax(0, 1fr) 26px; }
.kbtn { width: 26px; height: 26px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; border-radius: 6px; }
.kbtn:hover { background: var(--panel-2); }
.kbtn i { width: 11px; height: 11px; transform: rotate(45deg); border: 1.5px solid var(--muted); display: block; border-radius: 1px; }
.kbtn.on i { background: var(--accent); border-color: var(--accent); }
.field { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 13px; }
.field > span:first-child, .field > label:first-child { color: var(--muted); font-size: 12.5px; }
.inline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); }
.var { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.var input { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--panel-2); width: 100%; min-width: 0; }
.keybox { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.keybox h3 { color: var(--accent-text); }

.rule { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; background: var(--panel-2); }
.rule .top { display: grid; grid-template-columns: minmax(0, 1.3fr) 14px minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.rule .arrow { color: var(--muted); text-align: center; font-size: 12px; }
.rule .params { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.rule .params input[type=number] { width: 64px; font-family: var(--f-num); }
.rule input[type=checkbox] { width: auto; }
.rule select { font-size: 12.5px; }
.rule .field { grid-template-columns: 92px minmax(0, 1fr); }
.rule .params select { width: auto; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); }
.tag.state { border-color: var(--accent); color: var(--accent-text); }
.code { font-family: var(--f-num); font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13px; }
.preview-box { display: grid; place-items: end; height: 190px; border: 1px dashed var(--line-strong); border-radius: 10px; padding: 10px;
  background: linear-gradient(var(--panel-2), var(--panel-2)) top / 100% 22px no-repeat, var(--panel); position: relative; overflow: hidden; }
.preview-box.left { place-items: end start; }

/* 타임라인 */
.timeline { grid-area: tl; display: flex; flex-direction: column; overflow: hidden; }
.tl-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-block: 8px; padding-inline: 12px; border-bottom: 1px solid var(--line); }
.tl-bar select, .tl-bar input[type=text], .tl-bar input[type=number] { border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; background: var(--panel-2); }
.tl-bar #clipName { width: 130px; }
.tl-bar #clipDur { width: 72px; font-family: var(--f-num); }
.tl-bar #clipCool, .tl-bar #clipWeight { font-family: var(--f-num); }
.tl-time { font-family: var(--f-num); font-size: 12.5px; color: var(--muted); min-width: 108px; }
.sep { width: 1px; height: 22px; background: var(--line); }
.tl-scroll { flex: 1; overflow: auto; position: relative; }
.timeline.locked .tl-scroll { opacity: 0.45; pointer-events: none; }
#tl { position: relative; min-width: 520px; user-select: none; -webkit-user-select: none; }
.tl-row { display: grid; grid-template-columns: var(--lab) minmax(0, 1fr); height: 26px; border-bottom: 1px solid var(--line); }
.tl-row.ruler { height: 28px; position: sticky; top: 0; z-index: 3; background: var(--panel); }
.tl-label { padding: 0 10px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; border-right: 1px solid var(--line);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; background: var(--panel); position: sticky; left: 0; z-index: 2; }
.tl-row.part .tl-label { font-weight: 500; }
.tl-row.part.sel { background: var(--accent-soft); }
.tl-row.part.sel .tl-label { background: var(--accent-soft); color: var(--accent-text); }
.tl-row.prop .tl-label { padding-left: 24px; color: var(--muted); font-size: 12px; cursor: default; }
.tl-row.prop { background: var(--panel-2); }
.track { position: relative; cursor: text; }
.ruler .track { cursor: ew-resize; }
.tick { position: absolute; bottom: 0; width: 1px; background: var(--line-strong); height: 6px; }
.tick.major { height: 10px; }
.tick span { position: absolute; bottom: 11px; left: 3px; font: 11px var(--f-num); color: var(--muted); white-space: nowrap; }
.dot { position: absolute; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--muted); opacity: 0.7; pointer-events: none; }
.kf { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; transform: rotate(45deg); background: var(--accent);
  border: 1.5px solid var(--panel); cursor: ew-resize; border-radius: 1px; }
.kf.img { transform: none; border-radius: 3px; background: var(--ink); }
.kf.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.kf.step { background: var(--panel); border-color: var(--accent); }
.fade { position: absolute; top: 50%; height: 4px; margin-top: -2px; background: var(--ink); opacity: 0.35; border-radius: 2px; pointer-events: none; }
.endzone { position: absolute; top: 0; bottom: 0; right: 0; background: var(--bg); opacity: 0.6; pointer-events: none; }
#phLayer { position: absolute; top: 0; bottom: 0; left: var(--lab); right: 0; pointer-events: none; z-index: 4; }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); }
#playhead::before { content: ""; position: absolute; top: 0; left: -5px; width: 12px; height: 10px; background: var(--accent); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.tl-empty { padding: 28px 18px; color: var(--muted); font-size: 13px; }

.dlg { position: fixed; inset: 0; background: rgba(10, 15, 20, 0.5); display: grid; place-items: center; z-index: 50;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.dlg-card { background: var(--panel); border-radius: 14px; padding: 18px; width: min(560px, 100%); display: grid; gap: 10px; border: 1px solid var(--line); }
.dlg-card h2 { margin: 0; font-size: 16px; font-weight: 600; }
.dlg-card textarea { width: 100%; height: 180px; font: 11px/1.4 var(--f-num); border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--panel-2); resize: vertical; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--panel);
  padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 980px) {
  html, body { height: auto; }
  .app { display: flex; flex-direction: column; height: auto; }
  .stage-col { order: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stage-wrap { flex: none; min-height: 0; overflow: visible; }
  #stage { max-width: 520px; }
  .timeline { order: 2; height: 300px; }
  .side { order: 3; }
  .parts { order: 4; }
  .panel { overflow: visible; }
  .timeline.panel { overflow: hidden; }
  .tabs { position: static; }
  :root { --lab: 112px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
/* 로그인 인트로 보기 탭 */
body.viewer-mode .app { display: block; height: auto; background: var(--bg); }
body.viewer-mode .app > :not(header):not(#introViewer) { display: none !important; }
body.viewer-mode .bar-actions { display: none !important; }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <div class="stripe" aria-hidden="true"></div>
      <div><h1 id="edTitle">차로차로 모션 에디터</h1><small>파츠 · 키프레임 · 반응 규칙</small></div>
    </div>
    <nav class="chars" id="charTabs" aria-label="캐릭터"></nav>
    <div class="bar-actions">
      <button class="btn" id="bUndo" title="되돌리기 (Ctrl+Z)">되돌리기</button>
      <button class="btn" id="bRedo" title="다시 하기 (Ctrl+Shift+Z)">다시 하기</button>
      <button class="btn" id="bSiteLoad" hidden title="사이트에 올라가 있는 이 캐릭터 파일을 불러와요">사이트 버전 불러오기</button>
      <label class="btn" for="fLoad">불러오기</label>
      <input type="file" id="fLoad" accept=".json,application/json" hidden>
      <button class="btn primary" id="bSave">저장 (.json)</button>
      <span class="save-state" id="saveState" aria-live="polite"></span>
    </div>
  </header>

  <aside class="panel parts" aria-label="파츠">
    <div class="panel-h"><h2>파츠</h2>
      <label class="btn sm" for="fParts">+ 파츠 추가</label>
      <input type="file" id="fParts" multiple accept="image/png,image/webp,image/jpeg,image/svg+xml" hidden>
    </div>
    <p class="hint">위에 있을수록 앞에 그려져요. 같은 크기로 저장한 파츠 PNG를 한꺼번에 올리면 제자리에 맞춰져요.</p>
    <ul id="partList"></ul>
  </aside>

  <main class="stage-col">
    <div class="stage-top">
      <div class="seg" role="group" aria-label="모드">
        <button id="mEdit" aria-pressed="true">편집</button>
        <button id="mTest" aria-pressed="false">반응 테스트</button>
      </div>
      <span class="chip" id="ctxChip"></span>
    </div>
    <div class="stage-wrap" id="stageWrap"><canvas id="stage" role="img" aria-label="캐릭터 무대"></canvas></div>
    <p class="hint" id="stageHint"></p>
    <div class="testbar" id="testBar" hidden>
      <div class="row"><span class="chip live" id="tsLayer"></span><span class="chip" id="tsOne"></span></div>
      <div class="row">
        <button class="btn sm" id="tType">타자 신호</button>
        <button class="btn sm" id="tFlick">휙 신호</button>
        <button class="btn sm" id="tIdle">가만히 있는 상태로 건너뛰기</button>

$('partList').addEventListener('click', function (e) {
  var li = e.target.closest('.part');
  if (!li) return;
  var pid = li.dataset.pid, part = CP.findPart(P, pid);
  var btn = e.target.closest('button[data-act]');
  if (!btn) { S.sel = pid; S.selKey = null; renderAll(); return; }
  var act = btn.dataset.act, idx = P.parts.indexOf(part);
  if (act === 'vis') { S.hiddenParts[pid] = !S.hiddenParts[pid]; renderParts(); drawStage(); return; }
  if (act === 'front' && idx < P.parts.length - 1) { pushUndo(); P.parts.splice(idx, 1); P.parts.splice(idx + 1, 0, part); changed(); return; }
  if (act === 'back' && idx > 0) { pushUndo(); P.parts.splice(idx, 1); P.parts.splice(idx - 1, 0, part); changed(); return; }
  if (act === 'del') {
    if (!arm('del' + pid, btn)) { toast('한 번 더 누르면 "' + part.name + '" 파츠를 삭제해요'); return; }
    pushUndo();
    P.parts.forEach(function (ch) { if (ch.parent === pid) setParent(ch, part.parent); });
    P.parts.splice(P.parts.indexOf(part), 1);
    P.clips.forEach(function (c) { if (c.tracks) delete c.tracks[pid]; });
    if (S.sel === pid) S.sel = null;
    S.selKey = null;
    fixSelection(); changed(); toast('파츠를 삭제했어요');
  }
});

function readImage(file) {
  return new Promise(function (res) {
    var fr = new FileReader();
    fr.onload = function () {
      var src = fr.result, im = new Image();
      im.onload = function () { res({ name: file.name.replace(/\.[^.]+$/, ''), src: src, w: im.naturalWidth || 200, h: im.naturalHeight || 200 }); };
      im.onerror = function () { res(null); };
      im.src = src;
    };
    fr.onerror = function () { res(null); };
    fr.readAsDataURL(file);
  });
}
$('fParts').addEventListener('change', function (e) {
  var files = Array.prototype.slice.call(e.target.files || []);
  e.target.value = '';
  if (!files.length) return;
  Promise.all(files.map(readImage)).then(function (items) {
    var ok = items.filter(Boolean);
    if (!ok.length) { toast('그림을 읽지 못했어요. PNG, WEBP, JPG, SVG 파일인지 확인해 주세요'); return; }
    pushUndo();
    var maxDim = Math.max.apply(null, ok.map(function (i) { return Math.max(i.w, i.h); }));
    var lim = Math.min(P.stage.w, P.stage.h) * 0.9;
    var s = maxDim > lim ? lim / maxDim : 1;
    var first = null;
    ok.forEach(function (it) {
      var aid = uid('a_');
      POOL[aid] = it.src;
      var part = { id: uid('p_'), name: it.name, parent: null, pivot: { x: Math.round(it.w / 2), y: Math.round(it.h / 2) },
        rest: { x: P.stage.w / 2, y: P.stage.h / 2, rot: 0, sx: s, sy: s, op: 1, img: 0 },
        images: [{ name: it.name, asset: aid, w: it.w, h: it.h }], follow: { on: false, max: 6 } };
      P.parts.push(part);
      first = first || part.id;
    });
    S.sel = first; S.selKey = null;
    changed();
    toast('파츠 ' + ok.length + '개를 추가했어요');
  });
});

// 그림 추가·교체
var varTarget = null;
$('fVar').addEventListener('change', function (e) {
  var file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file || !varTarget) return;
  var tgt = varTarget; varTarget = null;
  readImage(file).then(function (it) {
    if (!it) { toast('그림을 읽지 못했어요'); return; }
    var part = CP.findPart(P, tgt.pid);
    if (!part) return;
    pushUndo();
    var aid = uid('a_');
    POOL[aid] = it.src;
    if (tgt.idx === 'new') {
      part.images.push({ name: it.name, asset: aid, w: it.w, h: it.h });
      toast('그림을 추가했어요. 동작에서 "그림" 키로 바꿔치기할 수 있어요');
    } else {
      var v = part.images[tgt.idx];
      if (tgt.idx === 0 && (v.w !== it.w || v.h !== it.h)) rescaleImageSpace(part, it.w / v.w, it.h / v.h);
      v.asset = aid; v.w = it.w; v.h = it.h;
      toast('그림을 바꿨어요. 위치와 크기, 동작은 그대로예요');
    }
    delete alphaCache[aid];
    changed();
  });
});
// 그림 크기가 바뀌어도 화면에 보이는 크기와 연결된 파츠 위치를 유지
function rescaleImageSpace(part, rx, ry) {
  part.pivot.x *= rx; part.pivot.y *= ry;
  part.rest.sx /= rx; part.rest.sy /= ry;
  P.parts.forEach(function (ch) {
    if (ch.parent !== part.id) return;
    ch.rest.x *= rx; ch.rest.y *= ry; ch.rest.sx *= rx; ch.rest.sy *= ry;
    P.clips.forEach(function (c) {
      var tr = c.tracks && c.tracks[ch.id];
      if (!tr) return;
      (tr.x || []).forEach(function (k) { k.v *= rx; });
      (tr.y || []).forEach(function (k) { k.v *= ry; });
    });
  });
}

  if (prop === 'x' || prop === 'y') return curClip() ? [-200, 200, 0.5] : [0, prop === 'x' ? P.stage.w : P.stage.h, 0.5];
  if (prop === 'rot') return [-180, 180, 0.5];
  if (prop === 'op') return [0, 100, 1];
  return [0, 300, 1];
}

function bindInspector(part) {

  PROPS.forEach(function (p) {
    $('r_' + p).addEventListener('input', function (e) { pushUndo('r_' + p + part.id); setVal(part, p, +e.target.value); refreshLight(); });
    $('n_' + p).addEventListener('change', function (e) { var v = parseFloat(e.target.value); if (!isFinite(v)) { updateInspectorValues(); return; } pushUndo(); setVal(part, p, v); refreshLight(); });

      else { setVal(part, p, uiVal(part, p)); S.selKey = { pid: part.id, prop: p, t: r2(S.t) }; }
      refreshLight(); renderInspector();
    });
  });
  $('sel_img').addEventListener('change', function (e) {

    var v = +e.target.value;

    refreshLight(); renderParts();
  });
  var ki = $('k_img');
  if (ki) ki.addEventListener('click', function () {
    pushUndo();
    var keys = track(c, part.id, 'img', false);
    if (keyIndex(keys, S.t) >= 0) { delKey(c, part.id, 'img', S.t); S.selKey = null; }
    else { setKey(c, part.id, 'img', S.t, imgVal(part)); S.selKey = { pid: part.id, prop: 'img', t: r2(S.t) }; }
    refreshLight(); renderInspector();

  var bf = $('bFace');
  if (bf) bf.addEventListener('click', function () {

  });
  var ka = $('bKeyAll');

  // 선택한 키

  if (key) {

    if ($('kE')) $('kE').addEventListener('change', function (e) { pushUndo(); key.e = e.target.value; refreshLight(); });

}
function updateInspectorValues() {
  var part = selPart();

    var v = uiVal(part, p, off);

    if (document.activeElement !== r) r.value = v;
    if (document.activeElement !== n) n.value = r2(v);
    var kb = $('k_' + p);
    if (kb) kb.classList.toggle('on', keyIndex(track(c, part.id, p, false), S.t) >= 0);
  });
  var si = $('sel_img');
  if (si && document.activeElement !== si) si.value = String(imgVal(part, off));
  var ki = $('k_img');
  if (ki) ki.classList.toggle('on', keyIndex(track(c, part.id, 'img', false), S.t) >= 0);
  var it = $('iTime');

  if (f === 'interrupt' || f === 'lock' || f === 'sustain') { r[f] = e.target.checked; if (f === 'sustain') renderRules(); }
  else if (f === 'pool') {
    var pool = r.clips && r.clips.length ? r.clips.slice() : (r.clip ? [r.clip] : []), id = e.target.dataset.cid;
    if (e.target.checked) { if (pool.indexOf(id) < 0) pool.push(id); } else pool = pool.filter(function (x) { return x !== id; });
    r.clips = pool; r.clip = pool[0] || '';
  }
  else if (num[f] != null) r[f] = Math.max(num[f], parseFloat(e.target.value) || num[f]);
  else if (f === 'from' || f === 'to') r[f] = +e.target.value;
  else if (f === 'clipLeft' || f === 'enter' || f === 'exit' || f === 'end') { if (e.target.value) r[f] = e.target.value; else delete r[f]; }
  else r[f] = e.target.value;
  if (f === 'event') {
    var d = RULE_DEF[r.event] || {};
    for (var k in d) if (r[k] == null) r[k] = d[k];
    renderRules();
  }
  scheduleSave();
});
$('tab-rules').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-act]'); if (!btn) return;
  var card = btn.closest('.rule'); var i = +card.dataset.i;
  if (btn.dataset.act === 'up' && i > 0) { pushUndo(); var r = P.rules.splice(i, 1)[0]; P.rules.splice(i - 1, 0, r); renderRules(); scheduleSave(); }
  if (btn.dataset.act === 'del') {
    if (!arm('rdel' + P.rules[i].id, btn)) { toast('한 번 더 누르면 규칙을 삭제해요'); return; }
    pushUndo(); P.rules.splice(i, 1); renderRules(); scheduleSave();
  }
});

// ---------- 사이트 설정 ----------
var SITE = 'https://iplaypiccolo.github.io/Charocharo/';
var SNIPPET = '<script src="' + SITE + 'charo-pet.js" data-src="' + SITE + 'charo-pet.json" defer><\/script>';
function renderSite() {
  var d = P.display;
  var h = '<div class="sec"><h3>화면에 보이는 모습</h3>' +
    '<div class="field"><label for="sName">캐릭터 이름</label><input type="text" id="sName" value="' + esc(P.name) + '"></div>' +
    '<div class="field"><label for="sSize">크기</label><div class="inline"><input type="number" id="sSize" min="60" max="320" step="10" value="' + d.size + '" style="width:80px"><span class="unit">px (정사각형)</span></div></div>' +
    '<div class="field"><label for="sCorner">위치</label><select id="sCorner"><option value="right"' + (d.corner !== 'left' ? ' selected' : '') + '>오른쪽 아래</option><option value="left"' + (d.corner === 'left' ? ' selected' : '') + '>왼쪽 아래</option></select></div>' +
    '<div class="field"><label for="sMargin">가장자리 여백</label><div class="inline"><input type="number" id="sMargin" min="0" max="120" step="2" value="' + d.margin + '" style="width:80px"><span class="unit">px</span></div></div>' +
    '<label class="check"><input type="checkbox" id="sMobile"' + (d.hideOnMobile ? ' checked' : '') + '> 휴대폰처럼 좁은 화면에서는 숨기기</label>' +
    '<label class="check"><input type="checkbox" id="sClose"' + (d.closable ? ' checked' : '') + '> 방문자가 숨길 수 있는 × 버튼 달기</label>' +
    '<div class="preview-box' + (d.corner === 'left' ? ' left' : '') + '" aria-label="실제 크기 미리보기"><canvas id="sPrev" style="width:' + Math.min(d.size, 170) + 'px;height:' + Math.min(d.size, 170) + 'px"></canvas></div>' +
    '<p class="hint">사이트 화면 구석에 이 크기로 떠 있어요' + (d.size > 170 ? ' (미리보기는 170px로 줄여서 보여줘요)' : '') + '.</p></div>';
  h += '<div class="sec"><h3>사이트에 반영하는 방법</h3><ol class="steps">' +
    '<li>위의 <b>저장 (.json)</b>으로 <span class="num">charo-pet.json</span> 받기</li>' +
    '<li>GitHub의 Charocharo 저장소에서 같은 이름의 파일을 이 파일로 덮어쓰기 (Add file → Upload files)</li>' +
    '<li>1~2분 뒤 사이트를 새로고침하면 반영돼요</li></ol>' +
    '<h3 style="margin-top:6px">다른 사이트에 붙이기</h3>' +
    '<p class="hint">제설 지원 사이트처럼 다른 페이지에 띄우려면 그 페이지의 <span class="num">&lt;/body&gt;</span> 바로 위에 아래 한 줄을 붙여 넣으세요. Charocharo 저장소의 파일을 바꾸면 붙인 사이트에도 자동으로 반영돼요.</p>' +
    '<div class="code" id="snip">' + esc(SNIPPET) + '</div><div class="inline"><button class="btn sm" id="bCopySnip">코드 복사</button></div>' +
    '<p class="hint">키보드 반응은 키가 눌렸다는 신호만 쓰고 입력한 글자는 읽지 않아요.</p></div>';
  h += '<div class="sec"><h3>처음부터 다시</h3><p class="hint">지금 작업을 지우고 예시 캐릭터로 되돌려요. 되돌리기로 취소할 수 있어요.</p>' +
    '<div class="inline"><button class="btn sm danger" id="bReset" data-text="예시로 초기화" data-arm-text="한 번 더 누르면 초기화">예시로 초기화</button></div></div>';
  $('tab-site').innerHTML = h;
  var upd = function (fn) { return function (e) { pushUndo(); fn(e); scheduleSave(); renderSite(); }; };
  $('sName').addEventListener('change', upd(function (e) { P.name = e.target.value.trim() || '캐릭터'; }));
  $('sSize').addEventListener('change', upd(function (e) { d.size = clamp(parseInt(e.target.value, 10) || 140, 60, 320); }));
  $('sCorner').addEventListener('change', upd(function (e) { d.corner = e.target.value; }));
  $('sMargin').addEventListener('change', upd(function (e) { d.margin = clamp(parseInt(e.target.value, 10) || 0, 0, 120); }));
  $('sMobile').addEventListener('change', upd(function (e) { d.hideOnMobile = e.target.checked; }));
  $('sClose').addEventListener('change', upd(function (e) { d.closable = e.target.checked; }));
  $('bCopySnip').addEventListener('click', function () { copyText(SNIPPET, $('snip')); });
  $('bReset').addEventListener('click', function (e) {
    if (!arm('reset', e.currentTarget)) return;
    pushUndo(); var ex = normalize(makeExample()); P = ex; S.sel = 'armL'; S.clip = 'c_jump'; S.t = 0.45; S.selKey = null; S.hiddenParts = {};
    changed(); toast('예시 캐릭터로 초기화했어요');
  });
  drawSitePreview();
}
function drawSitePreview() {
  var c = $('sPrev'); if (!c) return;
  var size = Math.min(P.display.size, 170), r = Math.min(3, window.devicePixelRatio || 1);
  c.width = Math.round(size * r); c.height = Math.round(size * r);
  var x = c.getContext('2d');
  var sc = c.width / Math.max(P.stage.w, P.stage.h);
  var fp = CP.finalPose(P, CP.offsetsFrom(P, {}), null);
  x.clearRect(0, 0, c.width, c.height);
  CP.render(x, P, fp, CP.worldMatrices(P, fp), [sc, 0, 0, sc, 0, 0]);
}

// ---------- 반응 테스트 ----------
var eng = null, rafTest = 0;
(function () { var s = '<option value="">지금 시각</option>'; for (var i = 0; i < 24; i++) s += '<option value="' + i + '">' + i + '시로 가정</option>'; $('tHour').innerHTML = s; })();
function setMode(m) {
  if (m === S.mode) return;
  S.mode = m;
  $('mEdit').setAttribute('aria-pressed', m === 'edit');
  $('mTest').setAttribute('aria-pressed', m === 'test');
  $('testBar').hidden = m !== 'test';
  cancelAnimationFrame(rafTest);
  if (m === 'test') {
    play(false); S.pivotEdit = false;
    eng = new CP.Engine(P);
    eng.hour = $('tHour').value === '' ? null : +$('tHour').value;
    if ($('tAuto').checked) eng.setAuto(false);
    renderPreviewRow();
    CP.preload(P).then(function () { if (S.mode === 'test') rafTest = requestAnimationFrame(testTick); });
  } else { eng = null; drawStage(); }
  renderTimeline(); renderInspector(); updateHints();
}
var lastStatus = '';
function testTick(ts) {
  if (S.mode !== 'test' || !eng) return;
  eng.p = P;
  var off = eng.update(ts);
  var fp = CP.finalPose(P, off, eng.follow);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  CP.render(ctx, P, fp, CP.worldMatrices(P, fp), viewM());
  var lc = CP.findClip(P, eng.layer), oc = eng.one && CP.findClip(P, eng.one.id);
  var st = (lc ? lc.name : '기본 자세') + '|' + (oc ? oc.name : '');
  if (st !== lastStatus) {
    lastStatus = st;
    $('tsLayer').textContent = '반복 중: ' + (lc ? lc.name : '기본 자세');
    $('tsOne').textContent = oc ? '한 번 재생: ' + oc.name : '한 번 재생: 없음';
  }
  rafTest = requestAnimationFrame(testTick);
}
document.addEventListener('pointermove', function (e) {
  if (S.mode !== 'test' || !eng) return;
  var r = cv.getBoundingClientRect();
  eng.pointer(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2), r.width / Math.max(P.stage.w, P.stage.h));
}, { passive: true });
$('mEdit').addEventListener('click', function () { setMode('edit'); });
$('mTest').addEventListener('click', function () { setMode('test'); });
$('tType').addEventListener('click', function () { if (eng) eng.key(); });
$('tFlick').addEventListener('click', function () { if (eng) eng.trigger('flick'); });
function previewList() {
  var list = (P.preview || []).filter(function (x) { return CP.findClip(P, x.clip); });
  if (!list.length) list = P.clips.filter(function (c) { return !c.loop; }).map(function (c) { return { label: c.name, clip: c.id }; });
  return list;
}
function renderPreviewRow() {
  $('pvRow').innerHTML = previewList().map(function (x) {
    return '<button class="btn sm" data-pv="' + esc(x.clip) + '"' + (x.extra ? ' style="opacity:.75"' : '') + '>' + esc(x.label) + '</button>';
  }).join('');
}
$('pvRow').addEventListener('click', function (e) {
  var b = e.target.closest('[data-pv]'); if (!b || !eng) return;
  eng.play(b.dataset.pv);
});
$('tAuto').addEventListener('change', function (e) { if (eng) eng.setAuto(!e.target.checked); });
$('tIdle').addEventListener('click', function () {
  if (!eng) return;
  var mx = 0; P.rules.forEach(function (r) { if (r.event === 'idle') mx = Math.max(mx, +r.sec || 30); });
  if (!mx) { toast('"한동안 가만히" 규칙이 없어요'); return; }
  eng.skipIdle(mx + 1); toast('가만히 ' + mx + '초가 지난 것으로 처리했어요. 마우스를 움직이면 깨어나요');
});
$('tHour').addEventListener('change', function (e) { if (eng) eng.hour = e.target.value === '' ? null : +e.target.value; });

// ---------- 저장 · 불러오기 ----------
function exportJSON() {
  var used = {};
  P.parts.forEach(function (pt) { pt.images.forEach(function (v) { if (POOL[v.asset]) used[v.asset] = POOL[v.asset]; }); });
  var out = JSON.parse(snapshot());
  out.assets = used;
  return JSON.stringify(out);
}
var saveTimer = 0;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    try {
      localStorage.setItem(STORE_KEY, exportJSON());
      var d = new Date();
      $('saveState').textContent = '이 브라우저에 자동 보관됨 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    } catch (e) {
      $('saveState').textContent = '자동 보관 안 됨 (그림 용량 초과). 저장 버튼으로 파일을 받아두세요';
    }
  }, 700);
}
var DL = null;
try { if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { DL = d; }).catch(function () {}); } catch (e) {}
var IN_CLAUDE = !!(window.claude && window.claude.use);
function browserDownload(data) {
  try {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = FILE_NAME;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  } catch (e) { return false; }
}
$('bSave').addEventListener('click', function () {
  var data = exportJSON();
  if (DL) {
    DL.save({ filename: FILE_NAME, data: data }).then(function () { toast(FILE_NAME + '을 저장했어요'); })
      .catch(function (err) { if (err && err.code === 'declined') toast('저장을 취소했어요'); else openDialog(data); });
  } else if (!IN_CLAUDE && browserDownload(data)) {
    toast(FILE_NAME + '을 내려받았어요');
  } else openDialog(data);
});
function openDialog(data) { $('dlgText').value = data; $('dlg').hidden = false; $('dlgCopy').focus(); }
$('dlgClose').addEventListener('click', function () { $('dlg').hidden = true; });
$('dlg').addEventListener('click', function (e) { if (e.target === $('dlg')) $('dlg').hidden = true; });
$('dlgCopy').addEventListener('click', function () { copyText($('dlgText').value, $('dlgText')); });
function copyText(text, el) {
  var fallback = function () {
    if (el && el.select) { el.focus(); el.select(); }
    else if (el) { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('선택해 두었어요. Ctrl+C로 복사하세요');
  };
  try {
    navigator.clipboard.writeText(text).then(function () { toast('복사했어요'); }, fallback);
  } catch (e) { fallback(); }
}
$('fLoad').addEventListener('change', function (e) {
  var file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var p = normalize(JSON.parse(fr.result));
      pushUndo(); P = p; S.selKey = null; S.hiddenParts = {}; S.clip = P.clips[0] ? P.clips[0].id : 'rest'; S.t = 0; S.sel = null;
      fixSelection(); alphaCache = {}; changed(); toast('불러왔어요: ' + file.name);
    } catch (err) { toast('불러오지 못했어요. 이 에디터에서 저장한 .json 파일인지 확인해 주세요'); }
  };
  fr.readAsText(file);
});

// ---------- 공통 ----------
var toastTimer = 0;
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function updateHints() {
  var c = curClip();
  $('ctxChip').textContent = S.mode === 'test' ? '반응 테스트 중' : (c ? '동작: ' + c.name : '기본 자세 편집');
  $('ctxChip').classList.toggle('live', S.mode === 'test' || !!c);
  $('stageHint').textContent = S.mode === 'test' ? '' :
    S.pivotEdit ? '무대를 클릭하거나 끌어서 회전 기준점을 옮기세요. 그림은 제자리에 있어요.' :
    c ? '파츠를 끌면 이동, 위쪽 동그라미를 끌면 회전 (Shift: 15°씩). 바꾼 값은 현재 시점에 키로 찍혀요. Space 재생, ← → 시간 이동.'
      : '파츠를 끌어 기본 위치를 잡고, 위쪽 동그라미로 기본 각도를 정하세요.';
  cv.classList.toggle('grab', S.mode === 'edit');
}
function refreshLight() { drawStage(); renderTimeline(); updateInspectorValues(); scheduleSave(); }
function renderAll() { renderParts(); renderInspector(); renderTimeline(); renderRules(); renderSite(); updateHints(); updateUndoBtns(); drawStage(); }
function changed() { fixSelection(); renderAll(); scheduleSave(); }

Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
  b.addEventListener('click', function () {
    S.tab = b.dataset.tab;
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (o) { o.setAttribute('aria-selected', o === b); });
    ['props', 'rules', 'site'].forEach(function (t) { $('tab-' + t).hidden = t !== S.tab; });
    document.querySelector('.side').scrollTop = 0;
    if (S.tab === 'site') drawSitePreview();
  });
});

window.addEventListener('keydown', function (e) {
  var tag = e.target && e.target.tagName;
  var inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (!$('dlg').hidden) { if (e.key === 'Escape') $('dlg').hidden = true; return; }
  if (S.mode === 'test') { if (!inField && eng) eng.key(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { if (inField) return; e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) { if (inField) return; e.preventDefault(); doRedo(); return; }
  if (inField) return;
  var c = curClip();
  if (e.key === ' ' && c) { e.preventDefault(); play(!S.playing); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && S.selKey) { e.preventDefault(); deleteSelKey(); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && c) {
    e.preventDefault(); play(false);
    S.t = clamp(r2(S.t + (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 0.1 : 0.01)), 0, c.dur);
    drawStage(); updatePlayhead(); updateInspectorValues();
  } else if (e.key === 'Escape' && S.pivotEdit) { S.pivotEdit = false; renderInspector(); updateHints(); drawStage(); }
});
$('bUndo').addEventListener('click', doUndo);
$('bRedo').addEventListener('click', doRedo);

if (window.ResizeObserver) new ResizeObserver(function () { fitStage(); renderTimeline(); }).observe($('stageWrap'));
window.addEventListener('resize', function () { fitStage(); renderTimeline(); });
if (window.matchMedia) {
  var mq = matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', drawStage);
}
new MutationObserver(drawStage).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

renderAll();
fitStage();
CP.preload(P).then(function () { drawStage(); drawSitePreview(); renderParts(); });

// 사이트에서 열었을 때: 사이트에 올라간 캐릭터 파일 불러오기
var ON_SITE = !window.claude && /^https?:$/.test(location.protocol);
// Claude 안에서 여는 에디터는 외부 사이트를 읽을 수 없어서, 게시할 때의 사이트 캐릭터를 함께 넣어 둠
var EMBED = EMBED_ALL;
function loadSiteVersion(auto) {
  var src = ON_SITE
    ? fetch(CHAR.file, { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; })
    : Promise.resolve(EMBED && EMBED[CHAR.id] ? JSON.parse(JSON.stringify(EMBED[CHAR.id])) : null);
  return src
    .then(function (p) {
      if (!p) { if (!auto) toast('사이트 파일을 찾지 못했어요'); return; }
      if (auto && undoStack.length) return;
      if (!auto) pushUndo();
      P = normalize(p); alphaCache = {}; S.selKey = null; S.hiddenParts = {};
      if (!CP.findClip(P, S.clip)) { S.clip = P.clips[0] ? P.clips[0].id : 'rest'; S.t = 0; }
      fixSelection();
      CP.preload(P).then(function () { changed(); toast('사이트에 올라간 캐릭터를 불러왔어요'); });
    })
    .catch(function () { if (!auto) toast('사이트 파일을 불러오지 못했어요'); });
}
// 탭 그리기
(function () {
  var nav = $('charTabs');
  nav.innerHTML = CHARS.map(function (c) { return '<a href="#' + c.id + '" data-id="' + c.id + '"' + (c.id === CHAR.id ? ' aria-current="page"' : '') + '>' + c.name + '</a>'; }).join('');
  nav.addEventListener('click', function (e) {
    var a = e.target.closest('a'); if (!a) return; e.preventDefault();
    if (a.dataset.id === CHAR.id) return;
    try { localStorage.setItem(STORE_KEY, exportJSON()); } catch (err) {}
    location.hash = a.dataset.id; location.reload();
  });
  $('edTitle').textContent = CHAR.name + ' 모션 에디터'; if ($('dlgName')) $('dlgName').textContent = FILE_NAME;
  document.title = CHAR.name + ' 모션 에디터';
})();
window.addEventListener('hashchange', function () { var h = location.hash.replace('#', ''); if (h && h !== CHAR.id && CHARS.some(function (c) { return c.id === h; })) location.reload(); });
if (ON_SITE || EMBED) {
  $('bSiteLoad').hidden = false;
  $('bSiteLoad').addEventListener('click', function () { loadSiteVersion(false); });
  if (!SAVED) loadSiteVersion(true);
}
})();
</script>
