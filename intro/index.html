<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 인트로 검수</title>
<style>
:root{--bg:#f3f6f9;--panel:#fff;--ink:#10243a;--sub:#4e6274;--line:#d6e1e9;--accent:#1f5f8f;--accent-ink:#fff;
  --sans:"Pretendard",-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1824;--panel:#14222f;--ink:#e4edf5;--sub:#9db0c1;--line:#29404f;--accent:#6fb0e0;--accent-ink:#0d1824;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1824;--panel:#14222f;--ink:#e4edf5;--sub:#9db0c1;--line:#29404f;--accent:#6fb0e0;--accent-ink:#0d1824;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding:20px max(16px,env(safe-area-inset-left,0px)) 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;margin:0}
p.lead{margin:4px 0 0;color:var(--sub);max-width:70ch}
.stage{position:relative;width:100%;aspect-ratio:1000/600;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#1f5f8f,#10243a)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px var(--mono);background:rgba(255,255,255,.92);color:#10243a;border-radius:6px;padding:3px 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:500 14px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;gap:6px;align-items:center;font-size:14px}
input[type=range]{flex:1;min-width:200px}
.note{font-size:13px;color:var(--sub);margin:0}
.err{color:#b3261e;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>로그인 인트로 검수 (차로차로 동작 중심)</h1>
    <p class="lead">다섯 친구를 하나의 시간축으로 재생합니다. 큰 ‘환영합니다!’ 글자와 둥근 배경 사각형은 위치 확인용 <b>임시 표시</b>이고, 다른 친구는 각자의 기존 동작을 시간만 맞춰 얹은 것입니다.</p>
  </header>
  <div class="stage"><canvas id="cv" role="img" aria-label="로그인 인트로 미리보기"></canvas>
    <div class="hud"><span class="chip" id="hT">0.00초</span><span class="chip" id="hPh">-</span><span class="chip" id="hFace">-</span></div></div>
  <div class="bar">
    <button id="bPlay" class="main" type="button">▶ 처음부터 재생</button>
    <button id="bSkip" type="button">건너뛰기</button>
    <label><input type="checkbox" id="tReduce"> 모션 줄이기</label>
    <label><input type="checkbox" id="tGuide" checked> 임시 글자·배경 표시</label>
  </div>
  <div class="bar"><label style="flex:1">시점 <input type="range" id="scrub" min="0" max="6.7" step="0.01" value="0"></label><span class="chip" id="hS">0.00</span></div>
  <p class="note" id="msg">불러오는 중…</p>
</div>
<script src="../charo-pet.js"></script>
<script src="charo-intro.js"></script>
<script src="intro-cast.js"></script>
<script src="preview.js"></script>
</body>
</html>
